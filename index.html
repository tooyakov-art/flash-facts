<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlashFacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050510;
  --surface:rgba(255,255,255,0.04);
  --surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --text:#f0f0f8;
  --text2:rgba(255,255,255,0.55);
  --accent:#818cf8;
  --r:24px;
}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* ===== CANVAS BG ===== */
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ===== SCREEN TRANSITIONS ===== */
.screen{
  position:relative;z-index:1;
  max-width:560px;margin:0 auto;padding:0 20px;
  min-height:100dvh;
  opacity:0;transform:translateY(20px);
  transition:opacity .5s ease,transform .5s ease;
  display:none;
}
.screen.active{display:block;opacity:1;transform:translateY(0)}

/* ===== HOME ===== */
.hero{padding:60px 0 40px;text-align:center}
.logo{
  font-size:3.2em;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(135deg,#818cf8 0%,#c084fc 30%,#f472b6 60%,#fb923c 100%);
  background-size:200% 200%;
  animation:gradShift 6s ease infinite;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.1;
}
@keyframes gradShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.tagline{color:var(--text2);font-size:1em;margin-top:10px;font-weight:400}

/* Stats */
.stats-row{
  display:flex;justify-content:center;gap:40px;
  padding:30px 0 36px;
}
.stat-item{text-align:center}
.stat-val{
  font-size:2em;font-weight:800;
  background:linear-gradient(135deg,#818cf8,#c084fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.stat-lbl{font-size:.7em;text-transform:uppercase;letter-spacing:2px;color:var(--text2);margin-top:2px}

/* Category cards */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:60px}
.cat{
  position:relative;border-radius:var(--r);padding:28px 20px 22px;
  cursor:pointer;overflow:hidden;
  border:1px solid var(--border);
  transition:transform .35s cubic-bezier(.4,0,.2,1),box-shadow .35s ease;
  -webkit-user-select:none;user-select:none;
}
.cat:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cat:active{transform:scale(.96);transition:transform .1s}
.cat .ic{font-size:3em;display:block;margin-bottom:14px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.cat .nm{font-weight:700;font-size:1em;line-height:1.3}
.cat .ct{font-size:.72em;color:rgba(255,255,255,.4);margin-top:6px;font-weight:500}
.cat .prog-mini{
  margin-top:10px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.08);overflow:hidden;
}
.cat .prog-mini-fill{height:100%;border-radius:4px;transition:width .6s ease}
/* glow overlay */
.cat::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.06),transparent 60%);
  pointer-events:none;
}
.cat::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:60%;
  background:linear-gradient(to top,rgba(0,0,0,.3),transparent);
  pointer-events:none;
}
/* cat themes */
.cat-kz{background:linear-gradient(145deg,#0369a1,#0e7490,#155e75)}
.cat-kz .prog-mini-fill{background:linear-gradient(90deg,#38bdf8,#06b6d4)}
.cat-ru{background:linear-gradient(145deg,#b91c1c,#991b1b,#7f1d1d)}
.cat-ru .prog-mini-fill{background:linear-gradient(90deg,#f87171,#ef4444)}
.cat-world{background:linear-gradient(145deg,#4338ca,#4f46e5,#6366f1)}
.cat-world .prog-mini-fill{background:linear-gradient(90deg,#818cf8,#a78bfa)}
.cat-dino{background:linear-gradient(145deg,#15803d,#166534,#14532d)}
.cat-dino .prog-mini-fill{background:linear-gradient(90deg,#4ade80,#22c55e)}
.cat-wow{background:linear-gradient(145deg,#9333ea,#7c3aed,#6d28d9)}
.cat-wow .prog-mini-fill{background:linear-gradient(90deg,#c084fc,#e879f9)}
.cats .cat:last-child:nth-child(odd){grid-column:1/-1}

/* ===== QUIZ SCREEN ===== */
.quiz-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 16px;
}
.btn-back{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:10px 16px;border-radius:14px;
  font-size:.85em;font-weight:600;cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.btn-back:hover{background:var(--surface2)}
.btn-back svg{width:18px;height:18px}
.quiz-counter{font-size:.85em;color:var(--text2);font-weight:600}

.quiz-cat-title{
  text-align:center;padding:8px 0 20px;
}
.quiz-cat-title .ic{font-size:2.4em;margin-bottom:4px}
.quiz-cat-title h2{font-size:1.3em;font-weight:800}

/* Progress */
.prog{
  position:relative;height:6px;border-radius:6px;
  background:rgba(255,255,255,.06);margin-bottom:28px;
  overflow:hidden;
}
.prog-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,#818cf8,#c084fc,#f472b6);
  background-size:200% 100%;
  animation:progShimmer 3s linear infinite;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
@keyframes progShimmer{0%{background-position:200% 0}100%{background-position:0% 0}}

/* ===== THE CARD ===== */
.card-wrap{
  perspective:1400px;
  height:420px;
  margin-bottom:24px;
  position:relative;
}
.card{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.25,.46,.45,.94);
  cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
.card.flipped{transform:rotateY(180deg)}
.card.swipe-left{
  transform:translateX(-120%) rotate(-15deg);
  opacity:0;transition:all .4s ease;
}
.card.swipe-right{
  transform:translateX(120%) rotate(15deg);
  opacity:0;transition:all .4s ease;
}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:var(--r);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:36px 28px;
  overflow:hidden;
}
/* FRONT face */
.face-front{
  background:var(--surface);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.face-front .big-ic{
  font-size:5em;
  margin-bottom:24px;
  animation:float 4s ease-in-out infinite;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.3));
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-8px) rotate(2deg)}
  75%{transform:translateY(4px) rotate(-1deg)}
}
.face-front .hint{
  font-size:1.15em;font-weight:600;
  color:rgba(255,255,255,.6);margin-bottom:8px;
}
.face-front .hint-sub{
  font-size:.8em;color:rgba(255,255,255,.25);
}
/* tap ring animation */
.face-front .tap-ring{
  position:absolute;
  width:100px;height:100px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.1);
  animation:ringPulse 2.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes ringPulse{
  0%{transform:scale(.8);opacity:.5}
  50%{transform:scale(1.3);opacity:0}
  100%{transform:scale(.8);opacity:0}
}
/* shimmer sweep */
.face-front::after{
  content:'';position:absolute;
  top:-100%;left:-100%;width:300%;height:300%;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.03) 50%,transparent 60%);
  animation:shimmer 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shimmer{
  0%{transform:translate(-30%,-30%)}
  100%{transform:translate(30%,30%)}
}

/* BACK face */
.face-back{
  transform:rotateY(180deg);
  background:linear-gradient(160deg,rgba(30,27,75,.95),rgba(20,20,40,.98));
  border:1px solid rgba(129,140,248,.2);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  text-align:left;
  justify-content:flex-start;
  padding-top:40px;
}
.face-back .fact-head{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;width:100%;
}
.face-back .fact-ic{font-size:2em}
.face-back .fact-label{
  font-size:.7em;text-transform:uppercase;letter-spacing:2px;
  color:var(--accent);font-weight:700;
}
.face-back .fact-body{
  font-size:1.05em;line-height:1.75;
  color:rgba(255,255,255,.88);
  flex:1;overflow-y:auto;width:100%;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.1) transparent;
}
.face-back .fact-body::-webkit-scrollbar{width:3px}
.face-back .fact-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
/* decorative accent line */
.face-back::before{
  content:'';position:absolute;top:0;left:28px;right:28px;height:3px;
  border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,#818cf8,#c084fc,#f472b6);
  pointer-events:none;
}

/* ===== NAV BUTTONS ===== */
.nav{display:flex;gap:12px}
.nav-btn{
  flex:1;padding:16px;border-radius:16px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);font-size:.95em;font-weight:600;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.nav-btn:hover{background:var(--surface2);transform:translateY(-2px)}
.nav-btn:active{transform:scale(.97);transition:transform .1s}
.nav-btn.primary{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-color:transparent;
  box-shadow:0 4px 20px rgba(99,102,241,.3);
}
.nav-btn.primary:hover{box-shadow:0 6px 30px rgba(99,102,241,.4)}
.nav-btn svg{width:18px;height:18px}

/* ===== COMPLETION ===== */
.done{text-align:center;padding:80px 20px}
.done-ic{font-size:5em;margin-bottom:20px;animation:float 3s ease-in-out infinite}
.done h2{font-size:1.8em;font-weight:800;margin-bottom:8px}
.done p{color:var(--text2);font-size:1em;margin-bottom:10px}
.done .score{
  font-size:3em;font-weight:900;
  background:linear-gradient(135deg,#818cf8,#f472b6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin:16px 0 30px;
}
.done .nav-btn{max-width:300px;margin:0 auto}

/* ===== CONFETTI CANVAS ===== */
#confettiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99;pointer-events:none}

/* ===== STREAK TOAST ===== */
.streak-toast{
  position:fixed;top:30px;left:50%;
  transform:translateX(-50%) translateY(-100px);
  background:rgba(15,15,30,.9);
  border:1px solid rgba(129,140,248,.3);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:#fff;padding:12px 24px;border-radius:16px;
  font-size:.9em;font-weight:600;z-index:50;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:8px;
}
.streak-toast.show{transform:translateX(-50%) translateY(0)}

/* ===== RESPONSIVE ===== */
@media(max-width:420px){
  .cats{grid-template-columns:1fr;gap:12px}
  .hero{padding:40px 0 24px}
  .logo{font-size:2.4em}
  .card-wrap{height:370px}
  .face{padding:28px 20px}
  .face-front .big-ic{font-size:4em}
  .stats-row{gap:24px}
}
@media(min-width:768px){
  .card-wrap{height:460px}
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>

<!-- STREAK TOAST -->
<div class="streak-toast" id="streakToast"></div>

<!-- ===== HOME SCREEN ===== -->
<div class="screen active" id="homeScreen">
  <div class="hero">
    <div class="logo">FlashFacts</div>
    <div class="tagline">Tap. Flip. Get your mind blown.</div>
  </div>
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-val" id="sViewed">0</div>
      <div class="stat-lbl">Learned</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="sTotal">0</div>
      <div class="stat-lbl">Total</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="sStreak">0</div>
      <div class="stat-lbl">Streak</div>
    </div>
  </div>
  <div class="cats" id="catsGrid"></div>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div class="screen" id="quizScreen">
  <div class="quiz-top">
    <button class="btn-back" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </button>
    <div class="quiz-counter" id="qCounter"></div>
  </div>

  <div class="quiz-cat-title" id="qTitle"></div>

  <div class="prog">
    <div class="prog-fill" id="progFill"></div>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card" onclick="flip()">
      <div class="face face-front" id="fFront">
        <div class="tap-ring"></div>
        <div class="big-ic" id="fIc"></div>
        <div class="hint">Tap to reveal</div>
        <div class="hint-sub">Fact #<span id="fNum">1</span></div>
      </div>
      <div class="face face-back" id="fBack">
        <div class="fact-head">
          <div class="fact-ic" id="bIc"></div>
          <div class="fact-label">DID YOU KNOW?</div>
        </div>
        <div class="fact-body" id="bText"></div>
      </div>
    </div>
  </div>

  <div id="navArea">
    <div class="nav">
      <button class="nav-btn" onclick="prev()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        Prev
      </button>
      <button class="nav-btn" onclick="shuffle()" style="flex:.6">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button class="nav-btn primary" onclick="next()">
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="done" id="doneArea" style="display:none">
    <div class="done-ic">&#127881;</div>
    <h2>Category Complete!</h2>
    <p>You've explored all facts here</p>
    <div class="score" id="doneScore"></div>
    <button class="nav-btn primary" onclick="goHome()" style="max-width:300px;margin:0 auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      All Categories
    </button>
  </div>
</div>

// ============ STATE ============
let cat=null,idx=0,flipped=false,streak=0;
const viewed=new Set();
try{const s=JSON.parse(localStorage.getItem('ff2_v')||'[]');s.forEach(x=>viewed.add(x))}catch(e){}
try{streak=parseInt(localStorage.getItem('ff2_s'))||0}catch(e){}
function save(){localStorage.setItem('ff2_v',JSON.stringify([...viewed]));localStorage.setItem('ff2_s',streak)}

// ============ BG PARTICLES ============
const bgC=document.getElementById('bgCanvas');
const bgX=bgC.getContext('2d');
let particles=[];
function initBg(){
  bgC.width=window.innerWidth;bgC.height=window.innerHeight;
  particles=[];
  const n=Math.min(80,Math.floor(bgC.width*bgC.height/12000));
  for(let i=0;i<n;i++){
    particles.push({
      x:Math.random()*bgC.width,
      y:Math.random()*bgC.height,
      r:Math.random()*1.8+.3,
      dx:(Math.random()-.5)*.3,
      dy:(Math.random()-.5)*.3,
      o:Math.random()*.4+.1
    });
  }
}
function drawBg(){
  bgX.clearRect(0,0,bgC.width,bgC.height);
  particles.forEach(p=>{
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<0)p.x=bgC.width;if(p.x>bgC.width)p.x=0;
    if(p.y<0)p.y=bgC.height;if(p.y>bgC.height)p.y=0;
    bgX.beginPath();bgX.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgX.fillStyle=`rgba(129,140,248,${p.o})`;bgX.fill();
  });
  // connections
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x;
      const dy=particles[i].y-particles[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){
        bgX.beginPath();
        bgX.moveTo(particles[i].x,particles[i].y);
        bgX.lineTo(particles[j].x,particles[j].y);
        bgX.strokeStyle=`rgba(129,140,248,${.06*(1-d/120)})`;
        bgX.lineWidth=.5;bgX.stroke();
      }
    }
  }
  requestAnimationFrame(drawBg);
}
initBg();drawBg();
window.addEventListener('resize',()=>{initBg()});

// ============ CONFETTI ============
const cfC=document.getElementById('confettiCanvas');
const cfX=cfC.getContext('2d');
let confetti=[];
function resizeCf(){cfC.width=window.innerWidth;cfC.height=window.innerHeight}
resizeCf();window.addEventListener('resize',resizeCf);
function boom(){
  const colors=['#818cf8','#c084fc','#f472b6','#fb923c','#34d399','#fbbf24'];
  for(let i=0;i<100;i++){
    confetti.push({
      x:window.innerWidth/2,y:window.innerHeight/2,
      vx:(Math.random()-.5)*20,
      vy:Math.random()*-18-5,
      r:Math.random()*6+3,
      c:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,
      rv:(Math.random()-.5)*10,
      life:1
    });
  }
}
function drawCf(){
  cfX.clearRect(0,0,cfC.width,cfC.height);
  confetti=confetti.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.rot+=p.rv;p.life-=.008;
    if(p.life<=0)return false;
    cfX.save();cfX.translate(p.x,p.y);cfX.rotate(p.rot*Math.PI/180);
    cfX.globalAlpha=p.life;
    cfX.fillStyle=p.c;
    cfX.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.5);
    cfX.restore();
    return true;
  });
  requestAnimationFrame(drawCf);
}
drawCf();

// ============ RENDER HOME ============
function renderHome(){
  const g=document.getElementById('catsGrid');
  g.innerHTML='';let total=0;
  CATS.forEach(c=>{
    total+=c.facts.length;
    const vn=c.facts.filter((_,i)=>viewed.has(c.id+'_'+i)).length;
    const pct=Math.round(vn/c.facts.length*100);
    const d=document.createElement('div');
    d.className='cat '+c.css;
    d.onclick=()=>openCat(c.id);
    d.innerHTML=`<span class="ic">${c.emoji}</span>
      <div class="nm">${c.name}</div>
      <div class="ct">${vn}/${c.facts.length} learned</div>
      <div class="prog-mini"><div class="prog-mini-fill" style="width:${pct}%"></div></div>`;
    g.appendChild(d);
  });
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sViewed').textContent=viewed.size;
  document.getElementById('sStreak').textContent=streak;
}

// ============ OPEN CATEGORY ============
function openCat(id){
  cat=CATS.find(c=>c.id===id);idx=0;flipped=false;
  switchScreen('quizScreen');
  document.getElementById('doneArea').style.display='none';
  document.getElementById('cardWrap').style.display='';
  document.getElementById('navArea').style.display='';
  document.getElementById('qTitle').innerHTML=`<div class="ic">${cat.emoji}</div><h2>${cat.name}</h2>`;
  showCard();
}

function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
  });
  setTimeout(()=>{
    document.getElementById(id).classList.add('active');
  },50);
}

// ============ SHOW CARD ============
function showCard(){
  if(!cat)return;
  if(idx>=cat.facts.length){
    document.getElementById('cardWrap').style.display='none';
    document.getElementById('navArea').style.display='none';
    const vn=cat.facts.filter((_,i)=>viewed.has(cat.id+'_'+i)).length;
    document.getElementById('doneScore').textContent=vn+'/'+cat.facts.length;
    document.getElementById('doneArea').style.display='';
    boom();
    return;
  }
  document.getElementById('doneArea').style.display='none';
  document.getElementById('cardWrap').style.display='';
  document.getElementById('navArea').style.display='';

  flipped=false;
  const card=document.getElementById('card');
  card.className='card';

  const ei=idx%cat.icons.length;
  document.getElementById('fIc').textContent=cat.icons[ei];
  document.getElementById('bIc').textContent=cat.icons[ei];
  document.getElementById('bText').textContent=cat.facts[idx];
  document.getElementById('fNum').textContent=idx+1;
  document.getElementById('qCounter').textContent=(idx+1)+' / '+cat.facts.length;

  const pct=Math.round((idx+1)/cat.facts.length*100);
  document.getElementById('progFill').style.width=pct+'%';

  // slide in animation
  const wrap=document.getElementById('cardWrap');
  wrap.style.animation='none';
  wrap.offsetHeight;
  wrap.style.animation='cardIn .4s ease forwards';
}

// ============ FLIP ============
function flip(){
  if(!cat||idx>=cat.facts.length)return;
  flipped=!flipped;
  const card=document.getElementById('card');
  card.classList.toggle('flipped');
  if(flipped){
    const key=cat.id+'_'+idx;
    if(!viewed.has(key)){
      viewed.add(key);streak++;save();
      if(streak%5===0){
        showStreak(streak+' facts streak! \u{1F525}');
      }
      if(streak%10===0)boom();
    }
  }
}

// ============ NAV ============
function next(){
  if(!cat)return;
  const card=document.getElementById('card');
  card.classList.add('swipe-left');
  setTimeout(()=>{
    if(idx<cat.facts.length-1)idx++;
    else idx=cat.facts.length;
    showCard();
  },300);
}
function prev(){
  if(!cat||idx<=0)return;
  const card=document.getElementById('card');
  card.classList.add('swipe-right');
  setTimeout(()=>{idx--;showCard()},300);
}
function shuffle(){
  if(!cat)return;
  idx=Math.floor(Math.random()*cat.facts.length);
  const card=document.getElementById('card');
  card.style.transition='transform .3s';
  card.style.transform='rotate(10deg) scale(.9)';
  setTimeout(()=>{card.style.transform='';showCard()},300);
}
function goHome(){
  cat=null;
  switchScreen('homeScreen');
  renderHome();
}

// ============ STREAK TOAST ============
function showStreak(t){
  const el=document.getElementById('streakToast');
  el.textContent=t;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ============ SWIPE ============
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=tx-e.changedTouches[0].screenX;
  const dy=ty-e.changedTouches[0].screenY;
  if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx))return;
  if(cat){dx>0?next():prev()}
},{passive:true});

// ============ KEYBOARD ============
document.addEventListener('keydown',e=>{
  if(!cat)return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();flipped?next():flip()}
  if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  if(e.key==='Enter'){e.preventDefault();flip()}
  if(e.key==='Escape')goHome();
});

// ============ CARD ANIM KEYFRAME ============
const style=document.createElement('style');
style.textContent=`@keyframes cardIn{from{opacity:0;transform:translateX(40px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}`;
document.head.appendChild(style);

// ============ INIT ============
renderHome();
</script>
