<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashFacts — Интересные факты</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --card-bg: #14141f;
  --text: #e8e8f0;
  --text-dim: #888;
  --radius: 20px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== Background particles ===== */
.bg-glow {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-glow::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
  top: -200px; left: -200px;
  animation: floatGlow 20s ease-in-out infinite;
}
.bg-glow::after {
  content: '';
  position: absolute;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(236,72,153,0.12) 0%, transparent 70%);
  bottom: -150px; right: -150px;
  animation: floatGlow 25s ease-in-out infinite reverse;
}
@keyframes floatGlow {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(100px, 80px); }
}

/* ===== Container ===== */
.container {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 30px 0 10px;
}
.header h1 {
  font-size: 2em;
  font-weight: 800;
  background: linear-gradient(135deg, #818cf8, #e879f9, #fb923c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}
.header p {
  color: var(--text-dim);
  font-size: 0.95em;
  margin-top: 6px;
}

/* ===== Stats bar ===== */
.stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 0 24px;
}
.stat {
  text-align: center;
}
.stat-num {
  font-size: 1.5em;
  font-weight: 700;
  color: #a78bfa;
}
.stat-label {
  font-size: 0.75em;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ===== Category grid ===== */
.categories {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding-bottom: 20px;
}
.cat-card {
  position: relative;
  border-radius: var(--radius);
  padding: 24px 16px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
  border: 1px solid rgba(255,255,255,0.06);
}
.cat-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
}
.cat-card:active {
  transform: scale(0.97);
}
.cat-card .emoji {
  font-size: 2.8em;
  display: block;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
.cat-card .name {
  font-weight: 700;
  font-size: 0.95em;
  line-height: 1.3;
}
.cat-card .count {
  font-size: 0.75em;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}
.cat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.03) 100%);
  pointer-events: none;
}

/* Category colors */
.cat-kz { background: linear-gradient(135deg, #0c4a6e, #155e75); }
.cat-ru { background: linear-gradient(135deg, #7f1d1d, #991b1b); }
.cat-world { background: linear-gradient(135deg, #3730a3, #4338ca); }
.cat-dino { background: linear-gradient(135deg, #365314, #4d7c0f); }
.cat-wow { background: linear-gradient(135deg, #9333ea, #c026d3); }

/* Full-width last card if odd number */
.categories .cat-card:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}

/* ===== Quiz screen ===== */
.quiz-screen {
  display: none;
}
.quiz-screen.active {
  display: block;
}
.home-screen.hidden {
  display: none;
}

/* Back button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 14px;
  font-size: 0.9em;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 20px;
}
.back-btn:hover {
  background: rgba(255,255,255,0.1);
}

/* Category title in quiz */
.quiz-title {
  text-align: center;
  margin-bottom: 8px;
}
.quiz-title .emoji { font-size: 2em; }
.quiz-title h2 {
  font-size: 1.4em;
  font-weight: 700;
  margin-top: 4px;
}

/* Progress */
.progress-bar {
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  height: 6px;
  margin: 16px 0 24px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 0.4s ease;
  background: linear-gradient(90deg, #818cf8, #e879f9);
}
.progress-text {
  text-align: center;
  font-size: 0.8em;
  color: var(--text-dim);
  margin-bottom: 20px;
}

/* ===== Flashcard ===== */
.card-container {
  perspective: 1200px;
  height: 380px;
  margin-bottom: 24px;
}
.flashcard {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}
.flashcard.flipped {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
}
.card-front {
  background: var(--card-bg);
}
.card-front .card-emoji {
  font-size: 4em;
  margin-bottom: 20px;
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
.card-front .tap-hint {
  font-size: 1.1em;
  font-weight: 600;
  color: rgba(255,255,255,0.7);
}
.card-front .tap-sub {
  font-size: 0.8em;
  color: rgba(255,255,255,0.3);
  margin-top: 8px;
}
.card-back {
  background: var(--card-bg);
  transform: rotateY(180deg);
  text-align: center;
}
.card-back .fact-emoji {
  font-size: 2.5em;
  margin-bottom: 16px;
}
.card-back .fact-text {
  font-size: 1.05em;
  line-height: 1.6;
  color: var(--text);
  max-height: 240px;
  overflow-y: auto;
}
.card-back .fact-text::-webkit-scrollbar {
  width: 4px;
}
.card-back .fact-text::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 4px;
}

/* Shimmer on card */
.card-face::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, transparent 60%);
  pointer-events: none;
}

/* ===== Navigation buttons ===== */
.nav-btns {
  display: flex;
  gap: 12px;
}
.nav-btn {
  flex: 1;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.nav-btn:hover {
  background: rgba(255,255,255,0.08);
}
.nav-btn:active {
  transform: scale(0.97);
}
.nav-btn.primary {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-color: transparent;
}
.nav-btn.primary:hover {
  opacity: 0.9;
}

/* ===== Shuffle animation ===== */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(60px); }
  to { opacity: 1; transform: translateX(0); }
}
.card-container.animate-in {
  animation: slideIn 0.4s ease;
}

/* ===== Responsive ===== */
@media (max-width: 380px) {
  .categories { grid-template-columns: 1fr; }
  .card-container { height: 340px; }
  .card-front .card-emoji { font-size: 3em; }
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(99,102,241,0.95);
  color: #fff;
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 0.9em;
  font-weight: 600;
  z-index: 100;
  transition: transform 0.4s ease;
  backdrop-filter: blur(10px);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ===== Completion screen ===== */
.completion {
  text-align: center;
  padding: 60px 20px;
}
.completion .big-emoji {
  font-size: 4em;
  margin-bottom: 16px;
}
.completion h2 {
  font-size: 1.6em;
  margin-bottom: 8px;
}
.completion p {
  color: var(--text-dim);
  margin-bottom: 30px;
}
.completion .nav-btn {
  max-width: 280px;
  margin: 0 auto;
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
  <!-- HOME SCREEN -->
  <div class="home-screen" id="homeScreen">
    <div class="header">
      <h1>FlashFacts</h1>
      <p>Нажми на карту — узнай невероятное</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="totalViewed">0</div>
        <div class="stat-label">Просмотрено</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="totalFacts">0</div>
        <div class="stat-label">Всего фактов</div>
      </div>
    </div>

    <div class="categories" id="categoriesGrid"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="quiz-screen" id="quizScreen">
    <button class="back-btn" onclick="goHome()">
      <span>&larr;</span> Назад
    </button>

    <div class="quiz-title" id="quizTitle"></div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText"></div>

    <div class="card-container" id="cardContainer">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face card-front" id="cardFront">
          <div class="card-emoji" id="frontEmoji"></div>
          <div class="tap-hint">Нажми чтобы узнать</div>
          <div class="tap-sub">факт #<span id="factNum">1</span></div>
        </div>
        <div class="card-face card-back" id="cardBack">
          <div class="fact-emoji" id="backEmoji"></div>
          <div class="fact-text" id="factText"></div>
        </div>
      </div>
    </div>

    <div id="navArea">
      <div class="nav-btns">
        <button class="nav-btn" onclick="prevFact()">
          <span>&larr;</span> Назад
        </button>
        <button class="nav-btn primary" onclick="nextFact()">
          Далее <span>&rarr;</span>
        </button>
      </div>
    </div>

    <!-- Completion -->
    <div class="completion" id="completionScreen" style="display:none;">
      <div class="big-emoji">&#127881;</div>
      <h2>Все факты изучены!</h2>
      <p>Ты просмотрел все факты в этой категории</p>
      <button class="nav-btn primary" onclick="goHome()" style="max-width:280px;margin:0 auto;">
        &#8592; К категориям
      </button>
    </div>
  </div>
</div>

// ========== STATE ==========
let currentCat = null;
let currentIndex = 0;
let isFlipped = false;
let viewed = new Set();

// Load from localStorage
try {
  const saved = JSON.parse(localStorage.getItem('flashfacts_viewed') || '[]');
  viewed = new Set(saved);
} catch(e) {}

function saveViewed() {
  localStorage.setItem('flashfacts_viewed', JSON.stringify([...viewed]));
}

// ========== RENDER CATEGORIES ==========
function renderCategories() {
  const grid = document.getElementById('categoriesGrid');
  grid.innerHTML = '';
  let total = 0;

  categories.forEach(cat => {
    total += cat.facts.length;
    const card = document.createElement('div');
    card.className = `cat-card ${cat.cssClass}`;
    card.onclick = () => openCategory(cat.id);

    const viewedInCat = cat.facts.filter((_, i) => viewed.has(`${cat.id}_${i}`)).length;

    card.innerHTML = `
      <span class="emoji">${cat.emoji}</span>
      <div class="name">${cat.name}</div>
      <div class="count">${viewedInCat} / ${cat.facts.length} изучено</div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('totalFacts').textContent = total;
  document.getElementById('totalViewed').textContent = viewed.size;
}

// ========== OPEN CATEGORY ==========
function openCategory(catId) {
  currentCat = categories.find(c => c.id === catId);
  currentIndex = 0;
  isFlipped = false;

  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.add('active');
  document.getElementById('completionScreen').style.display = 'none';
  document.getElementById('navArea').style.display = '';
  document.getElementById('cardContainer').style.display = '';

  document.getElementById('quizTitle').innerHTML = `
    <div class="emoji">${currentCat.emoji}</div>
    <h2>${currentCat.name}</h2>
  `;

  showCard();
}

// ========== SHOW CARD ==========
function showCard() {
  if (!currentCat) return;

  if (currentIndex >= currentCat.facts.length) {
    // Show completion
    document.getElementById('cardContainer').style.display = 'none';
    document.getElementById('navArea').style.display = 'none';
    document.getElementById('completionScreen').style.display = '';
    return;
  }

  document.getElementById('completionScreen').style.display = 'none';
  document.getElementById('cardContainer').style.display = '';
  document.getElementById('navArea').style.display = '';

  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');

  const emojiIdx = currentIndex % currentCat.cardEmojis.length;
  document.getElementById('frontEmoji').innerHTML = currentCat.cardEmojis[emojiIdx];
  document.getElementById('backEmoji').innerHTML = currentCat.cardEmojis[emojiIdx];
  document.getElementById('factText').innerHTML = currentCat.facts[currentIndex];
  document.getElementById('factNum').textContent = currentIndex + 1;

  // Progress
  const progress = ((currentIndex + 1) / currentCat.facts.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressText').textContent = `${currentIndex + 1} из ${currentCat.facts.length}`;

  // Animate
  const container = document.getElementById('cardContainer');
  container.classList.remove('animate-in');
  void container.offsetWidth; // force reflow
  container.classList.add('animate-in');
}

// ========== FLIP ==========
function flipCard() {
  if (!currentCat || currentIndex >= currentCat.facts.length) return;

  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped');

  if (isFlipped) {
    const key = `${currentCat.id}_${currentIndex}`;
    if (!viewed.has(key)) {
      viewed.add(key);
      saveViewed();
    }
  }
}

// ========== NAVIGATION ==========
function nextFact() {
  if (!currentCat) return;
  if (currentIndex < currentCat.facts.length - 1) {
    currentIndex++;
    showCard();
  } else {
    currentIndex = currentCat.facts.length;
    showCard();
  }
}

function prevFact() {
  if (!currentCat || currentIndex <= 0) return;
  currentIndex--;
  showCard();
}

function goHome() {
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.remove('hidden');
  currentCat = null;
  renderCategories();
}

// ========== SWIPE ==========
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });

function handleSwipe() {
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) < 50) return;

  if (currentCat) {
    if (diff > 0) nextFact();
    else prevFact();
  }
}

// ========== KEYBOARD ==========
document.addEventListener('keydown', e => {
  if (!currentCat) return;
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (!isFlipped) flipCard();
    else nextFact();
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prevFact();
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    flipCard();
  }
  if (e.key === 'Escape') {
    goHome();
  }
});

// ========== TOAST ==========
function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========== INIT ==========
renderCategories();
</script>
